name: PadLocal
options:
  deploymentTarget:
    iOS: "17.0"
targets:
  PadLocal:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Vendor/Engine-LICENSE.txt
        buildPhase: resources
    dependencies:
      - framework: Vendor/llama.xcframework
        embed: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.baghdadhost.padlocal
        CODE_SIGN_ENTITLEMENTS: Memory.entitlements
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: PadLocal
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_OBJC_BRIDGING_HEADER: Sources/Engine.h
        SWIFT_VERSION: "5.0"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        MARKETING_VERSION: "0.1"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "2"
