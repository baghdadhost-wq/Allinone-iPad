name: Build iPad host and client
on:
  workflow_dispatch:
  push:
    paths: ['apple/**', 'AllinoneClient.swiftpm/**', '.github/workflows/ipad-client.yml']
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Generate Apple project
        run: |
          command -v xcodegen || brew install xcodegen
          cd apple
          xcodegen generate
      - name: Compile iPad host and companion client
        run: |
          set -euo pipefail
          for app in AllinoneHost AllinoneClient; do
            xcodebuild -quiet -project apple/AllinoneClient.xcodeproj -scheme "$app" -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
            mkdir -p "$app/Payload"
            cp -R "build/Build/Products/Release-iphoneos/$app.app" "$app/Payload/"
            (cd "$app" && zip -qry "../$app-unsigned.ipa" Payload)
          done
      - name: Test the native link on loopback
        run: |
          swiftc -o /tmp/local-link-check AllinoneClient.swiftpm/LocalLink.swift apple/Tests/LocalLinkCheck.swift
          /tmp/local-link-check
      - uses: actions/upload-artifact@v4
        with:
          name: AllinoneHost-unsigned
          path: AllinoneHost-unsigned.ipa
      - uses: actions/upload-artifact@v4
        with:
          name: AllinoneClient-unsigned
          path: AllinoneClient-unsigned.ipa
