name: Build universal Allinone IPA
on:
  workflow_dispatch:
  push:
    paths: ['apple/**', 'AllinoneClient.swiftpm/**', '.github/workflows/ipad-client.yml']
permissions:
  contents: read
jobs:
  layout:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Check phone, tablet and split-screen layouts in WebKit
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps webkit
          python apple/Tests/responsive_layout.py
  assets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/cache@v4
        id: gateway-cache
        with:
          path: ${{ runner.temp }}/mobile-assets/gateways.dat
          key: mobile-gateways-v1-${{ hashFiles('apple/MobileNode/prepare.sh', 'apple/MobileNode/pack.py') }}
      - name: Build original gateway packages for the embedded JS runtime
        if: steps.gateway-cache.outputs.cache-hit != 'true'
        run: bash apple/MobileNode/prepare.sh "$RUNNER_TEMP/mobile-assets"
      - uses: actions/upload-artifact@v4
        with:
          name: mobile-gateway-resources
          path: ${{ runner.temp }}/mobile-assets/gateways.dat
          retention-days: 1
  gateway-check:
    needs: assets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - uses: actions/download-artifact@v4
        with:
          name: mobile-gateway-resources
          path: ${{ runner.temp }}/mobile-assets
      - name: Test upstream APIs and dashboards without Internet access
        run: sudo env PATH="$PATH" unshare --net bash apple/MobileNode/linux-smoke.sh "$RUNNER_TEMP/mobile-assets"
  build:
    needs: assets
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: mobile-gateway-resources
          path: apple/Vendor
      - name: Install verified NodeMobile framework for device and simulator
        run: |
          cd apple/Vendor
          curl -fLsS --retry 3 https://github.com/fogtape/nodejs-mobile/releases/download/v24.22.1-0/nodejs-mobile-ios-24.22.1-0.zip -o /tmp/node-mobile.zip
          echo '3fa1b8fb0720768b01c2e0dae3a17e788476e8c1613a1d9a54e206793b45326e  /tmp/node-mobile.zip' | shasum -a 256 -c -
          unzip -q /tmp/node-mobile.zip -d /tmp/node-mobile
          cp -R "$(find /tmp/node-mobile -type d -name NodeMobile.xcframework -print -quit)" .
      - name: Generate Apple project
        run: |
          command -v xcodegen || brew install xcodegen
          cd apple
          xcodegen generate
      - name: Compile universal iPhone and iPad app
        run: |
          set -euo pipefail
          xcodebuild -quiet -project apple/Allinone.xcodeproj -scheme Allinone -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Allinone.app Payload/
          zip -qry Allinone-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Allinone-unsigned
          path: Allinone-unsigned.ipa
      - name: Boot both upstream gateways inside the iOS app
        run: bash apple/MobileNode/simulator.sh
      - name: Exercise coding sessions, project writes and routing
        run: |
          swiftc -o /tmp/studio-check AllinoneClient.swiftpm/LocalLink.swift apple/Native/Routing.swift apple/Native/Workspace.swift apple/Native/CodingAgent.swift apple/Native/Exchange.swift apple/Tests/NativeStudioCheck.swift
          /tmp/studio-check
      - name: Test the native link on loopback
        run: |
          swiftc -o /tmp/local-link-check AllinoneClient.swiftpm/LocalLink.swift apple/Tests/LocalLinkCheck.swift
          /tmp/local-link-check

