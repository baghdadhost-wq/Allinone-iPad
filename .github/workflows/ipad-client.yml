name: Build iPad client
on:
  workflow_dispatch:
  push:
    paths:
      - 'AllinoneClient.swiftpm/**'
      - 'apple/**'
      - '.github/workflows/ipad-client.yml'
permissions:
  contents: read
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate client project
        run: |
          command -v xcodegen || brew install xcodegen
          cd apple
          xcodegen generate
      - name: Compile for iPhone and iPad
        run: |
          xcodebuild -project apple/AllinoneClient.xcodeproj -scheme AllinoneClient -configuration Release -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/AllinoneClient.app Payload/
          zip -qry AllinoneClient-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: AllinoneClient-unsigned
          path: AllinoneClient-unsigned.ipa
