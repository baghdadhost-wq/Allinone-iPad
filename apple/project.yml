name: Allinone
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Allinone:
    type: application
    platform: iOS
    sources:
      - path: Host
      - path: Allinone.swift
      - path: ../AllinoneClient.swiftpm/Client.swift
      - path: ../AllinoneClient.swiftpm/LocalLink.swift
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.baghdadhost.allinone
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "2"
        MARKETING_VERSION: "0.2"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "الاتصال بأجهزتك وتشغيل مضيف Allinone على الشبكة المحلية"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UNIVERSAL_APP"
        SWIFT_VERSION: "5.0"
