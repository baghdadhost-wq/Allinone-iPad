name: Allinone
options:
  deploymentTarget:
    iOS: "16.0"
targets:
  Allinone:
    type: application
    platform: iOS
    sources:
      - path: Host/Host.swift
      - path: MobileNode/MobileNode.mm
      - path: MobileNode/supervisor.cjs
        buildPhase: resources
      - path: MobileNode/mobile-sharp.cjs
        buildPhase: resources
      - path: MobileNode/gateway-worker.cjs
        buildPhase: resources
      - path: Vendor/gateways.dat
        buildPhase: resources
      - path: OriginalUI
        type: folder
        buildPhase: resources
      - path: Native
      - path: Allinone.swift
      - path: ../AllinoneClient.swiftpm/Client.swift
      - path: ../AllinoneClient.swiftpm/LocalLink.swift
    dependencies:
      - framework: Vendor/NodeMobile.xcframework
        embed: true
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.baghdadhost.allinone
        TARGETED_DEVICE_FAMILY: "1,2"
        CURRENT_PROJECT_VERSION: "9"
        SWIFT_OBJC_BRIDGING_HEADER: MobileNode/MobileNode.h
        CLANG_CXX_LANGUAGE_STANDARD: "c++17"
        MARKETING_VERSION: "0.9"
        INFOPLIST_KEY_NSLocalNetworkUsageDescription: "الاتصال بأجهزتك وتشغيل مضيف Allinone على الشبكة المحلية"
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) UNIVERSAL_APP"
        INFOPLIST_KEY_UIFileSharingEnabled: YES
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        SWIFT_VERSION: "5.0"
        # FoundationModels exists only on iOS 26+; weak-link it so older iPadOS versions can launch.
        OTHER_LDFLAGS: "$(inherited) -weak_framework FoundationModels"
  FolderUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [FolderUITests]
    dependencies:
      - target: Allinone
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: app.baghdadhost.allinone.folder-tests
        TEST_TARGET_NAME: Allinone
schemes:
  Allinone:
    build:
      targets:
        Allinone: all
    test:
      targets: [FolderUITests]
