<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Allinone</title>
<style>
:root{
  --bg:#faf9f5; --side:#f3f1ea; --panel:#ffffff; --text:#1f1e1b; --muted:#6f6b62; --line:#e6e2d8;
  --accent:#c96442; --accent-2:#b4532f; --user:#efece3; --code:#f4f2ec; --ok:#3f8f5b; --warn:#c08a1c; --err:#c0392b;
  --shadow:0 1px 2px rgba(0,0,0,.05),0 4px 16px rgba(0,0,0,.04);
}
[data-theme=dark]{
  --bg:#262624; --side:#1f1e1d; --panel:#30302e; --text:#ecebe6; --muted:#a19e95; --line:#3d3c39;
  --accent:#d97757; --accent-2:#e08a6c; --user:#383734; --code:#1c1b1a; --shadow:none;
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--text);font:15px/1.65 "Segoe UI","Noto Sans Arabic","Noto Sans",Tahoma,system-ui,sans-serif}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
#app{display:flex;height:100%}
/* sidebar */
#sidebar{width:270px;min-width:270px;background:var(--side);border-inline-end:1px solid var(--line);display:flex;flex-direction:column;padding:12px;gap:10px;transition:margin .2s}
#app.side-hidden #sidebar{margin-inline-start:-270px}
.brand{font-weight:700;font-size:18px;display:flex;align-items:center;gap:8px;padding:4px 6px}
.brand .star{color:var(--accent);font-size:22px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 12px}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:#fff}
.btn.primary:hover{background:var(--accent-2)}
.btn.ghost{background:transparent;border-color:transparent}
.btn.ghost:hover{background:var(--user);border-color:transparent}
.btn.small{padding:3px 9px;font-size:13px;border-radius:8px}
#search{border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:7px 10px;width:100%}
#convList{flex:1;overflow:auto;display:flex;flex-direction:column;gap:2px}
.conv{padding:8px 10px;border-radius:9px;cursor:pointer;display:flex;align-items:center;gap:6px}
.conv:hover{background:var(--user)}
.conv.active{background:var(--user);font-weight:600}
.conv .t{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.conv .acts{display:none;gap:2px}
.conv:hover .acts{display:flex}
.conv .acts button{border:0;background:transparent;padding:0 4px;color:var(--muted)}
.side-foot{display:flex;gap:6px;align-items:center;color:var(--muted);font-size:12px;flex-wrap:wrap}
/* main */
main{flex:1;display:flex;flex-direction:column;min-width:0}
#topbar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);flex-wrap:wrap}
#gwPills{display:flex;gap:6px;background:var(--side);padding:4px;border-radius:12px;border:1px solid var(--line)}
.pill{border:0;background:transparent;border-radius:9px;padding:6px 12px;display:flex;align-items:center;gap:7px;white-space:nowrap}
.pill.active{background:var(--panel);box-shadow:var(--shadow);font-weight:600}
.dot{width:8px;height:8px;border-radius:50%;background:#aaa;display:inline-block}
.dot.d-up{background:var(--ok)} .dot.d-warn{background:var(--warn)} .dot.d-off{background:#b9b5ab} .dot.d-err{background:var(--err)}
.spacer{flex:1}
.field{display:flex;align-items:center;gap:4px;font-size:13px;color:var(--muted)}
.field select,.field input{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:4px 8px;color:var(--text);max-width:220px}
#banner{display:none;margin:10px auto 0;max-width:820px;width:calc(100% - 28px);padding:10px 14px;border-radius:10px;background:#fbefe9;border:1px solid #f0c9b8;color:#7a3b22;font-size:14px}
[data-theme=dark] #banner{background:#4a2f25;border-color:#6b4031;color:#f6d5c7}
#banner.show{display:flex;gap:10px;align-items:center}
#messages{flex:1;overflow:auto;padding:22px 14px 30px}
.wrap{max-width:820px;margin:0 auto}
#welcome{text-align:center;margin-top:12vh}
#welcome h1{font-weight:500;font-size:30px;margin:0 0 8px;font-family:Georgia,"Noto Naskh Arabic",serif}
#welcome h1 .star{color:var(--accent)}
#welcome p{color:var(--muted);margin:4px 0}
.msg{margin:18px 0}
.msg.user{display:flex;justify-content:flex-start}
.bubble{background:var(--user);border-radius:16px;padding:10px 15px;max-width:85%;white-space:pre-wrap;word-wrap:break-word}
.bubble .badges{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.badge{font-size:11px;padding:1px 8px;border-radius:20px;background:var(--panel);color:var(--muted);border:1px solid var(--line)}
.sent-label{font-size:11px;color:var(--accent);font-weight:600;margin-bottom:4px;display:block}
.assistant .body{padding:2px 4px}
.assistant .body p{margin:.55em 0}
.assistant .body pre{background:var(--code);border:1px solid var(--line);border-radius:10px;padding:12px;overflow:auto;direction:ltr;text-align:left;position:relative;font-size:13px;line-height:1.5}
.assistant .body code{font-family:Consolas,"Cascadia Mono",Menlo,monospace;font-size:.92em}
.assistant .body :not(pre)>code{background:var(--code);padding:1px 5px;border-radius:5px;border:1px solid var(--line);direction:ltr;unicode-bidi:isolate}
.assistant .body table{border-collapse:collapse;margin:.6em 0;display:block;overflow:auto}
.assistant .body th,.assistant .body td{border:1px solid var(--line);padding:5px 9px}
.assistant .body blockquote{border-inline-start:3px solid var(--line);margin:.5em 0;padding:0 12px;color:var(--muted)}
.assistant .body h1,.assistant .body h2,.assistant .body h3{line-height:1.3;margin:1em 0 .4em}
.assistant .body a{color:var(--accent)}
.copy{position:absolute;top:6px;right:6px;font-size:11px;padding:2px 8px;border-radius:6px;border:1px solid var(--line);background:var(--panel);opacity:.8}
.tool{border:1px solid var(--line);border-radius:10px;margin:8px 0;background:var(--panel);font-size:13px}
.tool summary{padding:7px 11px;cursor:pointer;color:var(--muted);display:flex;gap:7px;align-items:center;list-style:none}
.tool summary::-webkit-details-marker{display:none}
.tool summary b{color:var(--text);font-weight:600}
.tool pre{margin:0 10px 10px;max-height:300px;overflow:auto;background:var(--code);padding:9px;border-radius:8px;direction:ltr;text-align:left;white-space:pre-wrap;font-size:12px}
.tool.error summary{color:var(--err)}
.thinking{font-size:13px;color:var(--muted);border-inline-start:2px solid var(--line);padding-inline-start:10px;margin:6px 0;white-space:pre-wrap;max-height:160px;overflow:auto}
.notice{font-size:13px;color:var(--muted);text-align:center;margin:10px 0}
.err{color:var(--err);background:rgba(192,57,43,.07);border:1px solid rgba(192,57,43,.25);padding:8px 12px;border-radius:10px;white-space:pre-wrap;margin:6px 0}
.meta{display:flex;gap:10px;align-items:center;color:var(--muted);font-size:12px;margin-top:6px;flex-wrap:wrap}
.meta button{border:0;background:transparent;color:var(--muted);padding:2px 4px;border-radius:6px}
.meta button:hover{background:var(--user);color:var(--text)}
.cursor::after{content:"▍";animation:blink 1s steps(2) infinite;color:var(--accent)}
@keyframes blink{50%{opacity:0}}
.spin{display:inline-block;width:12px;height:12px;border:2px solid var(--line);border-top-color:var(--accent);border-radius:50%;animation:sp 0.8s linear infinite}
@keyframes sp{to{transform:rotate(360deg)}}
/* composer */
#composer{padding:6px 14px 14px}
.box{max-width:820px;margin:0 auto;background:var(--panel);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow);padding:10px 12px 8px}
.box:focus-within{border-color:var(--accent)}
#input{width:100%;border:0;outline:0;resize:none;background:transparent;min-height:26px;max-height:260px;line-height:1.6}
.row{display:flex;align-items:center;gap:6px;flex-wrap:wrap;margin-top:6px}
.toggle{display:inline-flex;align-items:center;gap:5px;border:1px solid var(--line);border-radius:20px;padding:3px 11px;font-size:13px;cursor:pointer;user-select:none;color:var(--muted)}
.toggle input{display:none}
.toggle.on{background:rgba(201,100,66,.12);border-color:var(--accent);color:var(--accent);font-weight:600}
#send{width:36px;height:36px;border-radius:10px;border:0;background:var(--accent);color:#fff;font-size:18px;display:flex;align-items:center;justify-content:center}
#send:disabled{opacity:.4;cursor:default}
#send.stop{background:var(--text)}
#projectBtn{max-width:260px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr}
#chips{display:flex;gap:6px;flex-wrap:wrap;max-width:820px;margin:0 auto 6px}
.chipfile{font-size:12px;background:var(--user);border-radius:8px;padding:3px 8px;display:flex;gap:6px;align-items:center}
.chipfile button{border:0;background:transparent;color:var(--muted);padding:0}
.chipfile.busy{opacity:.7}
#gwPower.on{color:var(--err);border-color:rgba(192,57,43,.4)}
.approval{border:2px solid var(--accent);border-radius:12px;padding:10px 12px;margin:10px 0;background:var(--panel)}
.approval.done{border-width:1px;border-color:var(--line);opacity:.85}
.approval .ap-h{font-weight:600;margin-bottom:6px}
.approval pre{background:var(--code);border-radius:8px;padding:8px;direction:ltr;text-align:left;white-space:pre-wrap;max-height:220px;overflow:auto;font-size:12.5px;margin:0 0 8px}
.approval .ap-btns{display:flex;gap:8px;flex-wrap:wrap}
.approval .ap-state{font-size:13px;color:var(--muted)}
#preBtn.on{background:rgba(63,143,91,.13);border-color:var(--ok);color:var(--ok);font-weight:600}
.tabs{display:flex;gap:4px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:3px}
.tabs button{flex:1;border:0;background:transparent;border-radius:8px;padding:5px}
.tabs button.active{background:var(--user);font-weight:600}
.conv .tag{font-size:11px;color:var(--muted)}
#projChip{display:none;max-width:820px;margin:0 auto 6px;font-size:12.5px;color:var(--muted)}
#projChip.show{display:flex;gap:8px;align-items:center}
#projChip b{color:var(--text)}
#projChip button{border:0;background:transparent;color:var(--muted);padding:0 4px}
.pview h2{margin:6px 0 2px;font-weight:600}
.pview .sub{color:var(--muted);font-size:13px;margin-bottom:14px}
.pgrid{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
.card h3{margin:0 0 8px;font-size:15px}
.card label{display:block;font-size:12.5px;color:var(--muted);margin:8px 0 3px}
.card input,.card textarea,.card select,.modal textarea,.modal input,.modal select{width:100%;border:1px solid var(--line);background:var(--bg);border-radius:9px;padding:7px 9px;color:var(--text)}
.card textarea{min-height:150px;resize:vertical}
.flist{display:flex;flex-direction:column;gap:4px;margin-top:6px}
.fitem{display:flex;gap:8px;align-items:center;font-size:13px;background:var(--user);border-radius:8px;padding:4px 8px}
.fitem span{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fitem button{border:0;background:transparent;color:var(--muted)}
.pconv{padding:7px 9px;border-radius:8px;cursor:pointer;font-size:14px}
.pconv:hover{background:var(--user)}
.plist{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:12px;margin-top:12px}
.pcard{cursor:pointer}
.pcard:hover{border-color:var(--accent)}
.pcard .d{color:var(--muted);font-size:13px;margin-top:4px;min-height:1.4em}
.pcard .n{color:var(--muted);font-size:12px;margin-top:8px}
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.35);display:none;align-items:center;justify-content:center;z-index:20;padding:16px}
#overlay.show{display:flex}
.modal{background:var(--panel);border-radius:16px;box-shadow:0 10px 40px rgba(0,0,0,.25);width:min(760px,100%);max-height:92vh;display:flex;flex-direction:column;padding:16px 18px;gap:10px}
.modal h3{margin:0}
.modal .mbody{overflow:auto;display:flex;flex-direction:column;gap:8px}
.modal textarea{min-height:240px;resize:vertical;font-size:13px}
.modal textarea.mono{direction:ltr;text-align:left;font-family:Consolas,Menlo,monospace;white-space:pre}
.modal .mbtns{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.modal .muted{color:var(--muted);font-size:12.5px}
@media (max-width:760px){.pgrid{grid-template-columns:1fr}}
.hochip{display:none;max-width:820px;margin:0 auto 6px;font-size:12.5px;color:var(--muted)}
.hochip.show{display:flex;gap:8px;align-items:center}
.hochip button{border:0;background:transparent;color:var(--muted)}
.ctxwarn{border:1px solid var(--accent);border-radius:12px;padding:9px 12px;margin:8px 0;font-size:13.5px;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.krow{display:grid;grid-template-columns:1fr auto auto;gap:8px;align-items:center;padding:6px 0;border-bottom:1px solid var(--line);font-size:13.5px}
.krow .kn b{font-weight:600}
.krow .kn small{color:var(--muted);display:block}
.krow.done{opacity:.65}
.kadd{display:flex;gap:6px;grid-column:1/-1}
.kadd input{flex:1}
.kstat{font-size:15px;font-weight:600;margin:4px 0 8px}
.bfiles{font-size:13px;margin:6px 0;display:flex;flex-direction:column;gap:3px}
.bfiles .bf{display:flex;gap:8px;align-items:center}
.bfiles code{direction:ltr;unicode-bidi:isolate}
.bplan{display:flex;flex-direction:column;gap:4px;font-size:13px;max-height:260px;overflow:auto}
.bplan label{display:flex;gap:8px;align-items:center;justify-content:flex-start}
.bplan input{width:auto !important;flex:none}
.bfiles > button{align-self:flex-start}
.bplan .rej{color:var(--err)}
.bsteps{font-size:13.5px;line-height:1.7}
.vis{border:1px solid var(--line);border-radius:12px;padding:9px 11px;margin:8px 0;background:var(--panel)}
.vis.bad{border-color:rgba(192,57,43,.35)}
.vis.good{border-color:rgba(63,143,91,.45)}
.vis .vh{font-weight:600;font-size:14px;margin-bottom:4px}
.vis .vp{font-size:13px;color:var(--err);white-space:pre-wrap;margin:3px 0}
.vis .vn{font-size:12px;color:var(--muted)}
.shots{display:flex;gap:8px;flex-wrap:wrap;margin-top:6px}
.shots figure{margin:0;width:150px;cursor:zoom-in}
.shots img{width:150px;height:100px;object-fit:cover;object-position:top;border:1px solid var(--line);border-radius:8px;background:#fff}
.shots figcaption{font-size:11px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;direction:ltr;text-align:left}
.bigshot{max-width:100%;max-height:78vh;border-radius:8px;border:1px solid var(--line);align-self:center}
.vbadge code{direction:ltr;unicode-bidi:isolate}
.vbadge{display:inline-block;max-width:100%;overflow-wrap:anywhere;margin:8px 0 2px;padding:3px 10px;border-radius:14px;font-size:12.5px;border:1px solid var(--line);color:var(--muted)}
.vbadge.ok{border-color:var(--ok);color:var(--ok);background:rgba(63,143,91,.08)}
.vbadge.bad{border-color:var(--err);color:var(--err);background:rgba(192,57,43,.06)}
pre.vout{white-space:pre-wrap;direction:ltr;text-align:left;max-height:200px;overflow:auto;font-size:12px}
.intr{border:1px solid var(--warn);background:rgba(192,138,28,.08);border-radius:12px;padding:10px 12px;margin:10px 0;font-size:14px}
.intr .ih{font-weight:600;margin-bottom:4px}
.intr .ia{color:var(--muted);margin-bottom:8px}
.intr details{font-size:12px;color:var(--muted);margin-bottom:8px}
.intr details pre{white-space:pre-wrap;direction:ltr;text-align:left;max-height:160px;overflow:auto;background:var(--code);padding:6px;border-radius:6px}
.intr .ib{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.waitbox{border:1px dashed var(--accent);border-radius:12px;padding:9px 12px;margin:10px 0;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-size:14px}
.hint{max-width:820px;margin:6px auto 0;color:var(--muted);font-size:12px;text-align:center}
@media (max-width:760px){#sidebar{position:fixed;z-index:5;height:100%}#app.side-hidden #sidebar{margin-inline-start:-290px}.field select,.field input{max-width:130px}}
</style>
</head>
<body>
<div id="app">
  <aside id="sidebar">
    <div class="brand"><span class="star">✳</span> Allinone</div>
    <button class="btn primary" id="newChat"></button>
    <div class="tabs"><button id="tabChats" class="active" data-i="chats"></button><button id="tabProjects" data-i="projects"></button></div>
    <input id="search">
    <div id="convList"></div>
    <div class="side-foot">
      <button class="btn small ghost" id="themeBtn">◐</button>
      <button class="btn small ghost" id="langBtn">EN</button>
      <span id="ver"></span>
      <button class="btn small ghost" id="quitBtn"></button>
    </div>
  </aside>
  <main>
    <header id="topbar">
      <button class="btn ghost small" id="sideBtn" aria-label="menu">☰</button>
      <div id="gwPills"></div>
      <button class="btn small" id="gwPower"></button>
      <select id="account" class="btn small" style="display:none"></select>
      <button class="btn small" id="keysBtn" style="display:none"></button>
      <button class="btn small" id="gwAction"></button>
      <span class="spacer"></span>
      <button class="btn small" id="preBtn"></button>
      <button class="btn small" id="reportBtn"></button>
      <label class="field"><span data-i="model"></span><input id="model" list="modelList" autocomplete="off"><datalist id="modelList"></datalist></label>
      <label class="field"><span data-i="effort"></span><select id="effort"></select></label>
      <label class="field"><span data-i="perm"></span><select id="perm"></select></label>
    </header>
    <div id="banner"></div>
    <section id="messages"><div class="wrap" id="thread"></div></section>
    <footer id="composer">
      <div id="projChip"></div>
      <div id="hoChip" class="hochip"></div>
      <div id="chips"></div>
      <div class="box">
        <textarea id="input" rows="1"></textarea>
        <div class="row">
          <button class="btn small ghost" id="attachBtn" title="">📎</button>
          <input type="file" id="fileInput" multiple hidden>
          <button class="btn small ghost" id="answerBtn">📥</button>
          <label class="toggle" id="tQuick"><input type="checkbox" id="quick">💬 <span data-i="quick"></span></label>
          <label class="toggle" id="tLight"><input type="checkbox" id="light">🪶 <span data-i="light"></span></label>
          <label class="toggle" id="tFailover"><input type="checkbox" id="failover">↪ <span data-i="failover"></span></label>
          <label class="toggle" id="tVisual"><input type="checkbox" id="visual">👁 <span data-i="visual"></span></label>
          <label class="toggle" id="tVerify"><input type="checkbox" id="verify">🔁 <span data-i="verify"></span></label>
          <label class="toggle" id="tDeep"><input type="checkbox" id="deep">🧠 <span data-i="deep"></span></label>
          <label class="toggle" id="tMemory"><input type="checkbox" id="memory">📝 <span>Memory</span></label>
          <label class="toggle" id="tSent"><input type="checkbox" id="showSent">👁 <span data-i="showSent"></span></label>
          <span class="spacer"></span>
          <button class="btn small" id="projectBtn"></button>
          <button id="send" disabled>↑</button>
        </div>
      </div>
      <div class="hint" data-i="hint"></div>
    </footer>
  </main>
</div>
<div id="overlay"><div class="modal" id="modal"></div></div>
<input type="file" id="projFileInput" multiple hidden>
<input type="file" id="answerFile" accept=".txt,.md,.markdown,.text,.log,.json" hidden>
<script>
"use strict";
const I18N = {
  ar: {newChat:"+ محادثة جديدة", search:"بحث في المحادثات", model:"النموذج", effort:"الجهد", perm:"الصلاحيات",
    verify:"تحقق وأصلح", verifyTip:"Allinone يجرّب النتيجة عندما يقول النموذج إنه انتهى (اختبارات/بناء)؛ إذا فشلت يعيد الخطأ إليه ليصلحه ويغيّر الأسلوب إن تكرر، ثم يتحقق من جديد",
    vRound:"🔁 تحقق آلي (الجولة {n})", vPass:"✔ نجح", vFail:"✘ فشل (رمز {code}) — أُعيد الخطأ إلى النموذج ليصلحه", vSelf:"🔎 لا يوجد أمر تحقق؛ طُلب من النموذج أن يجرّب النتيجة بنفسه",

/* Display name instead of "Claude"/"Anthropic" (config: branding.name). Commands, paths and the
   real model ids sent to the server are not changed. */
function BRAND(){ return (S.state && S.state.brand) || ""; }
function brandText(s){
  const b = BRAND(); if(!b || typeof s!=="string") return s;
  return s.replace(/\bClaude\.ai\b/g, b + (S.lang==="ar"?" (ويب)":" (web)")).replace(/\b(Claude|Anthropic)\b/g, b);
}
const MODEL_RE = /\bclaude(?=[-_ .]?(?:\d|opus|sonnet|haiku|fable|mythos|instant|code|v\d))/gi;
function maskModel(m){ const b = BRAND(); if(!b || !m) return m; return String(m).replace(MODEL_RE, b.toLowerCase()).replace(/\banthropic\//gi, b.toLowerCase()+"/"); }
let MODELMAP = new Map();
function realModel(v){
  if(!v) return v; if(MODELMAP.has(v)) return MODELMAP.get(v);
  const b = BRAND(); if(!b) return v;
  const q = b.toLowerCase().replace(/[.*+?^${}()|[\]\\]/g,"\\$&");
  return v.replace(new RegExp("\\b"+q+"/","gi"), "anthropic/").replace(new RegExp("\\b"+q+"(?=[-_ .])","gi"), "claude");
}

function esc(s){ return String(s??"").replace(/[&<>"']/g, c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }

/* ---------- markdown (safe: everything is escaped first) ---------- */
function inline(s){
  const codes = [];
  s = s.replace(/`([^`\n]+)`/g, (_,c)=>{ codes.push(c); return "\u0000"+(codes.length-1)+"\u0000"; });
  s = esc(s);
  s = s.replace(/\*\*([^*\n]+)\*\*/g,"<strong>$1</strong>").replace(/(^|[^*])\*([^*\n]+)\*(?!\*)/g,"$1<em>$2</em>");
  s = s.replace(/\[([^\]\n]+)\]\((https?:\/\/[^\s)]+)\)/g,'<a href="$2" target="_blank" rel="noopener">$1</a>');
  s = s.replace(/(^|[\s(])(https?:\/\/[^\s<)]+)/g,'$1<a href="$2" target="_blank" rel="noopener">$2</a>');
  return s.replace(/\u0000(\d+)\u0000/g, (_,i)=>"<code>"+esc(codes[+i])+"</code>");
}
function md(src){
  const out = []; const lines = String(src||"").replace(/\r\n/g,"\n").split("\n"); let i = 0;
  while(i < lines.length){
    let line = lines[i];
    const fence = line.match(/^\s*```\s*([\w+#.-]*)/);
    if(fence){ const buf=[]; i++; while(i<lines.length && !/^\s*```/.test(lines[i])){ buf.push(lines[i]); i++; } i++;
      out.push('<pre><button class="copy" data-copy>'+t("copy")+'</button><code>'+esc(buf.join("\n"))+'</code></pre>'); continue; }
    if(/^\s*$/.test(line)){ i++; continue; }
    const h = line.match(/^(#{1,4})\s+(.*)/);
    if(h){ out.push("<h"+(h[1].length+1)+' dir="auto">'+inline(h[2])+"</h"+(h[1].length+1)+">"); i++; continue; }
    if(/^\s*(---|\*\*\*)\s*$/.test(line)){ out.push("<hr>"); i++; continue; }
    if(/^\s*\|.*\|\s*$/.test(line) && i+1<lines.length && /^\s*\|?[\s:-]+\|[\s|:-]*$/.test(lines[i+1])){
      const row = l => l.trim().replace(/^\||\|$/g,"").split("|").map(c=>inline(c.trim()));
      let html = "<table><thead><tr>"+row(line).map(c=>"<th>"+c+"</th>").join("")+"</tr></thead><tbody>"; i+=2;
      while(i<lines.length && /^\s*\|.*\|\s*$/.test(lines[i])){ html += "<tr>"+row(lines[i]).map(c=>"<td>"+c+"</td>").join("")+"</tr>"; i++; }
      out.push(html+"</tbody></table>"); continue; }
    if(/^\s*>/.test(line)){ const buf=[]; while(i<lines.length && /^\s*>/.test(lines[i])){ buf.push(lines[i].replace(/^\s*>\s?/,"")); i++; }
      out.push('<blockquote dir="auto">'+md(buf.join("\n"))+"</blockquote>"); continue; }
    const li = line.match(/^\s*([-*+]|\d+[.)])\s+/);
    if(li){ const ordered = /\d/.test(li[1]); const items=[];
      while(i<lines.length && /^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){ items.push(lines[i].replace(/^\s*([-*+]|\d+[.)])\s+/,"")); i++;
        while(i<lines.length && /^\s{2,}\S/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i])){ items[items.length-1] += " "+lines[i].trim(); i++; } }
      out.push((ordered?"<ol>":"<ul>")+items.map(x=>'<li dir="auto">'+inline(x)+"</li>").join("")+(ordered?"</ol>":"</ul>")); continue; }
    const buf=[]; while(i<lines.length && !/^\s*$/.test(lines[i]) && !/^\s*```/.test(lines[i]) && !/^(#{1,4})\s/.test(lines[i]) && !/^\s*([-*+]|\d+[.)])\s+/.test(lines[i]) && !/^\s*>/.test(lines[i])){ buf.push(lines[i]); i++; }
    out.push('<p dir="auto">'+buf.map(inline).join("<br>")+"</p>");
  }
  return out.join("\n");
}

/* A reply that is still running on the server (page reloaded, another tab...): follow it. */
async function watchConv(id){
  const el = document.createElement("div"); el.className = "msg assistant"; el.innerHTML = `<div class="body"></div>`;
  const run = {el, body: el.querySelector(".body"), parts: [], runId:null, watch:true};
  S.running = run; updateSend(); renderThread(); banner(t("reattached"));
  while(S.running===run && S.conv===id){
    let st; try{ st = await api(`/api/conversations/${id}/live`); }catch(e){ break; }
    if(!st.running) break;
    run.runId = st.run_id;
    const old = Object.fromEntries(run.parts.filter(x=>x.kind==="approval").map(x=>[x.id,x]));
    run.parts = (st.parts||[]).map(p=>p.kind==="text"&&p.error?{kind:"error",text:p.text}:p)
      .concat((st.pending||[]).map(a=>old[a.id]||{kind:"approval", id:a.id, tool:a.tool, input:a.input, state:null}))
      .concat(st.waiting?[{kind:"wait", until:st.waiting.until, title:st.waiting.title, attempt:st.waiting.attempt, max:st.waiting.max}]:[]);
    drawRun(run);
    await new Promise(r=>setTimeout(r, 1000));
  }
  if(S.running===run){ S.running = null; updateSend(); banner(""); if(S.conv===id) openConv(id); }
}

function openBridge(r){

    <textarea id="bAnswer" dir="auto" placeholder="<<<FILE: ...>>>"></textarea><div id="bPlan"></div></div>
    <div class="mbtns"><button class="btn" id="bLater">${esc(t("webLater"))}</button><span class="spacer"></span>
      <button class="btn" id="bPreview">${esc(t("webPreview"))}</button><button class="btn primary" id="bApply" disabled>${esc(t("webApply"))}</button></div>`);

    $("#bCopy").onclick = async ()=>{ try{ await navigator.clipboard.writeText(r.package); }catch(e){ const ta=document.createElement("textarea"); ta.value=r.package; document.body.append(ta); ta.select(); document.execCommand("copy"); ta.remove(); }
      $("#bCopy").textContent = t("webCopied"); window.open("https://claude.ai/new", "_blank", "noopener"); };
    $("#bDl").onclick = ()=>{ const a=document.createElement("a"); a.href=URL.createObjectURL(new Blob([r.package],{type:"text/plain;charset=utf-8"})); a.download=r.name; a.click(); };
  }
  let plan = null;
  $("#bPreview").onclick = async ()=>{
    const answer = $("#bAnswer").value; if(!answer.trim()) return;
    try{ plan = await api("/api/bridge/preview",{method:"POST",body:{conversation_id:S.conv, answer}}); }catch(e){ banner(e.message,true); return; }
    const acts = t("webAct");
    $("#bPlan").innerHTML = (plan.plan.length ? `<div class="bplan">${plan.plan.map((x,i)=>`<label class="${x.action==="rejected"?"rej":""}"><input type="checkbox" data-bp="${i}" ${["create","modify","delete"].includes(x.action)?"checked":"disabled"}>
        <span>${esc(acts[x.action]||x.action)}</span><code>${esc(x.path)}</code><span class="muted">${x.added!=null?`+${x.added} −${x.removed}`:""} ${esc(x.why||"")}</span></label>`).join("")}</div>` : `<div class="muted">${esc(t("webNoFiles"))}</div>`)
      + (plan.runs.length ? `<div class="muted" style="margin-top:6px">${esc(t("webRuns"))}</div>${plan.runs.map(c=>`<code dir="ltr">${esc(c)}</code>`).join("<br>")}` : "");
    $("#bApply").disabled = false;

  $("#bApply").onclick = async ()=>{
    if(!plan) return;
    const paths = [...document.querySelectorAll("[data-bp]")].filter(b=>b.checked).map(b=>plan.plan[+b.dataset.bp].path);
    $("#bApply").disabled = true; $("#bApply").textContent = "…";
    try{ const res = await api("/api/bridge/apply",{method:"POST",body:{conversation_id:S.conv, answer:$("#bAnswer").value, paths,
          verify:$("#verify").checked, visual:$("#visual").checked}});
      closeModal(); const txt = (res.meta.parts||[]).filter(p=>p.kind==="text").map(p=>p.text).join("\n\n");
      S.messages.push({id:res.message_id, role:"assistant", display:txt, meta:res.meta}); renderThread(); loadConvs();
    }catch(e){ banner(e.message,true); $("#bApply").disabled = false; $("#bApply").textContent = t("webApply"); }
  };

  const brief = p.input && (p.input.file_path||p.input.path||p.input.command||p.input.pattern||p.input.url||p.input.description||"");
  const state = p.result==null ? '<span class="spin"></span>' : (p.is_error?"✘":"✔");
  return `<details class="tool ${p.is_error?"error":""}" data-tool="${esc(p.id||"")}"><summary>${state} 🔧 <b>${esc(p.name||t("tool"))}</b> <span dir="ltr">${esc(String(brief).slice(0,90))}</span></summary><pre>${esc(inp)}</pre>${p.result!=null?`<pre>${esc(p.result)}</pre>`:""}</details>`;
}
function approvalHTML(p){
  const i = p.input||{};
  const detail = i.command || i.file_path || i.path || i.url || JSON.stringify(i, null, 2);
  const extra = (i.command && i.description) ? "\n# "+i.description : "";
  const state = p.state==="allow" ? `<span class="ap-state">${esc(t("apAllowed"))}</span>` : p.state==="deny" ? `<span class="ap-state">${esc(t("apDenied"))}</span>`
    : `<div class="ap-btns"><button class="btn primary small" data-ap="${esc(p.id)}" data-act="once">${esc(t("apOnce"))}</button>
       <button class="btn small" data-ap="${esc(p.id)}" data-act="conv">${esc(t("apConv"))}</button>
       <button class="btn small" data-ap="${esc(p.id)}" data-act="deny">${esc(t("apDeny"))}</button></div>`;
  return `<div class="approval ${p.state?"done":""}"><div class="ap-h">🔐 ${esc(t("apTitle"))} <b dir="ltr">${esc(p.tool)}</b></div><pre>${esc(String(detail)+extra)}</pre>${state}</div>`;
}
function metaHTML(meta, text){
  const bits = [meta.quick?t("quickBadge"):"", meta.light?t("lightBadge"):"", brandText(meta.gateway_title||meta.gateway), maskModel(meta.model), meta.duration_ms?((meta.duration_ms/1000).toFixed(1)+" "+t("sec")):"", meta.num_turns?(meta.num_turns+" "+t("turns")):"", meta.cost_usd?("$"+Number(meta.cost_usd).toFixed(4)):""].filter(Boolean);
  return `<div class="meta"><span>${bits.map(esc).join(" · ")}</span><button data-copytext>${esc(t("copy"))}</button><button data-mem>${esc(t("toMemory"))}</button></div>`;
}
function imgURL(p){ return "/api/image?path="+encodeURIComponent(p)+"&t="+encodeURIComponent(TOKEN); }
function visualHTML(v){
  const state = v.ok===true ? "good" : v.ok===false ? "bad" : "";
  const head = fmt(t("visTitle"),{n:v.round}) + " — " + (v.ok===true ? t("visOk") : v.ok===false ? t("visBad") : t("visSkip"));
  const run = (v.command||v.url) ? `<div class="vn" dir="ltr">${esc(t("visRun"))} ${esc(v.command||"")} ${v.url?"→ "+esc(v.url):""}</div>` : "";
  const probs = (v.problems||[]).map(p=>`<div class="vp" dir="auto">✘ ${esc(p)}</div>`).join("");
  const note = v.skipped||v.error ? `<div class="vn" dir="auto">${esc(v.skipped||v.error)}</div>` : "";
  const rv = v.review; let review = "";
  if(rv){ review = `<div class="vn" dir="auto">${esc(fmt(t("visReview"),{r:rv.reviewer||"—"}))} ${esc(rv.verdict==="ok"?t("visRevOk"):rv.verdict==="problems"?t("visRevBad"):(rv.text||t("visRevSkip")).slice(0,200))}</div>`; }
  const shots = (v.shots||[]).length ? `<div class="shots">${v.shots.map(s=>`<figure data-shot="${esc(s.path)}" data-cap="${esc(s.name+" · "+(s.url||""))}"><img loading="lazy" src="${imgURL(s.path)}" alt=""><figcaption>${esc(s.name)}${s.tokens?` · ≈${s.tokens} tok`:""}</figcaption></figure>`).join("")}</div>` : "";
  return `<div class="vis ${state}"><div class="vh">${esc(head)}</div>${run}${probs}${review}${note}${shots}</div>`;
}
function openShot(path, cap){
  openModal(`<h3 dir="ltr" style="font-size:14px">${esc(cap)}</h3><img class="bigshot" src="${imgURL(path)}" alt=""><div class="mbtns"><span class="spacer"></span><button class="btn small" id="shotClose">${esc(t("close"))}</button></div>`);
  $("#shotClose").onclick = closeModal;
}
document.addEventListener("click", e=>{ const f = e.target.closest("[data-shot]"); if(f) openShot(f.dataset.shot, f.dataset.cap); });
function renderVisualToggle(){
  const st = (S.state && S.state.visual) || {}; const lab = $("#tVisual").querySelector("span");
  lab.textContent = t("visual") + (st.available ? "" : " " + t("visualMissing"));
}
$("#visual").addEventListener("change", async e=>{
  const st = (S.state && S.state.visual) || {};
  if(!e.target.checked || st.available) return;
  if(!confirm(t("visualInstallAsk"))) return;
  try{ await api("/api/visual/install",{method:"POST",body:{}}); }catch(err){ banner(err.message,true); return; }
  banner(t("visualInstalling"));
  for(let i=0;i<900;i++){
    await new Promise(r=>setTimeout(r,2000));
    let v; try{ v = await api("/api/visual"); }catch(err){ continue; }
    if(!v.installing){
      S.state.visual = v; renderVisualToggle();
      banner(v.available ? t("visualReady") : t("visualFailed")+" "+(v.log||"").slice(-300), !v.available); break;
    }
    banner(t("visualInstalling")+" "+(v.log||"").split("\n").slice(-1)[0]);
  }
});
function interruptHTML(meta){
  const d = meta.interrupted; const g = gwInfo(S.gateway);
  const other = S.gateway && meta.gateway && S.gateway!==meta.gateway && g;
  const at = d.resume_at ? new Date(d.resume_at*1000).toLocaleTimeString([], {hour:"2-digit", minute:"2-digit"}) : "";
  return `<div class="intr"><div class="ih">${esc(t("intrTitle"))} ${esc(d.title||d.reason)}</div><div class="ia" dir="auto">${esc(d.advice||"")}${at?" · "+esc(fmt(t("resumeAt"),{t:at})):""}</div>
    ${d.detail&&d.detail.trim()?`<details><summary>${esc(t("intrDetail"))}</summary><pre>${esc(d.detail)}</pre></details>`:""}
    <div class="ib"><button class="btn primary small" data-resume>${esc(other?fmt(t("resumeVia"),{g:g.title}):t("resume"))}</button>
    <button class="btn small" data-report>${esc(t("report"))}</button></div></div>`;
}
function assistantHTML(m, isLast){
  const meta = m.meta||{}; const parts = meta.parts || [{kind:"text", text:m.display}];
  const all = SHOWALL() || meta.bridge_run;
  const body = parts.filter(p=>all || p.kind!=="tool").map(p=>p.kind==="tool"?toolHTML(p):(p.error?`<div class="err">${esc(brandText(p.text))}</div>`:md(brandText(p.text)))).join("");
  if(!all){  // only the answer
    const intrQ = ((isLast && meta.interrupted && !S.running) ? interruptHTML(meta) : "") + ((isLast && !S.running) ? ctxWarnHTML(meta) : "");
    if(!body && !intrQ) return "";
    return `<div class="msg assistant" data-text="${esc(m.display)}"><div class="body">${body}${bridgeHTML(m)}</div>${metaHTML(meta)}${intrQ}</div>`;
  }
  const auto = (meta.approvals||[]).filter(a=>a.auto).map(a=>`<div class="notice">${esc(fmt(t("preAuto"),{t:a.tool}))}</div>`).join("");
  const intr = ((isLast && meta.interrupted && !S.running) ? interruptHTML(meta) : "") + ((isLast && !S.running) ? ctxWarnHTML(meta) : "");
  const v = meta.verify; let ver = "";
  if(v){
    ver = (v.checks||[]).map(c=>`<div class="${c.code===0?"notice":"err"}" dir="auto">${esc(fmt(t("vRound"),{n:c.round, c:c.cmd}) + " — " + (c.code===0 ? t("vPass") : fmt(t("vFail"),{code:c.code})))}${c.code===0?"":`<details><summary>${esc(t("intrDetail"))}</summary><pre class="vout">${esc(c.output||"")}</pre></details>`}</div>`).join("");
    if(v.status==="self") ver += `<div class="notice">${esc(t("vSelf"))}</div>`;
    ver += (v.visual||[]).map(visualHTML).join("");
    const badge = fmt((t("vBadge")||{})[v.status]||"", {n:(v.checks||[]).length});
    if(badge) ver += `<div class="vbadge ${v.status==="passed"?"ok":v.status==="self"?"":"bad"}">${esc(badge)}${v.cmd?` · <code>${esc(v.cmd)}</code>`:""}</div>`;
  }
  return `<div class="msg assistant" data-text="${esc(m.display)}"><div class="body">${auto}${body}${bridgeHTML(m)}${ver}</div>${metaHTML(meta)}${intr}</div>`;
}
function renderThread(){
  if(S.view==="project") return renderProjectView();
  const th = $("#thread");
  if(!S.messages.length && !S.running){
    th.innerHTML = `<div id="welcome"><h1><span class="star">✳</span> ${esc(t("welcome"))}</h1><p>${esc(t("welcomeSub"))}</p></div>`; return;
  }
  th.innerHTML = S.messages.map((m,i)=>m.role==="user"?userHTML(m):assistantHTML(m, i===S.messages.length-1)).join("");
  if(S.running) th.appendChild(S.running.el);
  wire(th); scrollDown(true);
}
function wire(root){
  root.querySelectorAll("[data-copy]").forEach(b=>b.onclick=()=>{ navigator.clipboard.writeText(b.parentElement.querySelector("code").innerText); b.textContent=t("copied"); });
  root.querySelectorAll("[data-copytext]").forEach(b=>b.onclick=()=>{ navigator.clipboard.writeText(b.closest(".msg").dataset.text||""); b.textContent=t("copied"); });
  root.querySelectorAll("[data-resume]").forEach(b=>b.onclick=()=>send({resume:true}));
  root.querySelectorAll("[data-report]").forEach(b=>b.onclick=()=>$("#reportBtn").click());
  root.querySelectorAll("[data-mem]").forEach(b=>b.onclick=async()=>{ const txt = b.closest(".msg").dataset.text||""; if(!txt) return;
    await api("/api/memory",{method:"POST",body:{text:txt.slice(0,4000), tags:"gui"}}); b.textContent=t("saved"); });
}
function scrollDown(force){ const box = $("#messages"); if(force || box.scrollHeight - box.scrollTop - box.clientHeight < 160) box.scrollTop = box.scrollHeight; }

/* ---------- attachments ---------- */
$("#attachBtn").onclick = ()=>$("#fileInput").click();
function fmt(s, v){ return s.replace(/\{(\w+)\}/g, (_,k)=>v[k]); }
async function uploadFile(f, target){
  const limit = (S.state.max_upload_mb||200)*1024*1024, mb = x=>Math.ceil(x/1048576);
  if(f.size > limit) throw new Error(fmt(t("tooBig"), {n:f.name, s:mb(f.size), l:mb(limit)}));
  let res;
  try{
    // The file goes as raw bytes (no base64), written to disk by the server as it arrives.
    res = await fetch((target||"/api/upload")+"?name="+encodeURIComponent(f.name), {method:"POST",
      headers:{"X-Allinone-Token":TOKEN, "Content-Type":"application/octet-stream"}, body:f});
  }catch(e){ throw new Error(fmt(t("uploadFail"), {n:f.name})); }
  let data = null; try{ data = await res.json(); }catch(e){}
  if(!res.ok) throw new Error((data && data.error) || ("HTTP "+res.status));
  return data.path;
}
$("#fileInput").onchange = async e=>{
  const list = [...e.target.files]; e.target.value = "";
  for(const f of list){
    const item = {name:f.name, path:null}; S.attachments.push(item); renderChips(); updateSend();
    try{ item.path = await uploadFile(f); }
    catch(err){ S.attachments.splice(S.attachments.indexOf(item),1); banner(err.message,true); }
    renderChips(); updateSend();
  }
};
function renderChips(){ $("#chips").innerHTML = S.attachments.map((a,i)=>`<span class="chipfile ${a.path?"":"busy"}">${a.path?"📎":'<span class="spin"></span>'} ${esc(a.name)}${a.path?"":" · "+esc(t("uploading"))} <button data-rm="${i}">✕</button></span>`).join("");
  document.querySelectorAll("[data-rm]").forEach(b=>b.onclick=()=>{ S.attachments.splice(+b.dataset.rm,1); renderChips(); updateSend(); }); }

/* ---------- sending ---------- */
const input = $("#input");
function autosize(){ input.style.height="auto"; input.style.height=Math.min(input.scrollHeight,260)+"px"; }
function updateSend(){ const b = $("#send"); if(S.running){ b.disabled=false; b.classList.add("stop"); b.textContent="■"; b.title=t("stopGen"); return; }
  b.classList.remove("stop"); b.textContent="↑"; b.title=""; b.disabled = !input.value.trim() || S.attachments.some(a=>!a.path); }
input.oninput = ()=>{ autosize(); updateSend(); };
input.onkeydown = e=>{ if(e.key==="Enter" && !e.shiftKey && !e.isComposing){ e.preventDefault(); if(!S.running) send(); } };
$("#send").onclick = ()=>{ if(S.running) stopRun(); else send(); };
async function stopRun(){ if(S.running){ try{ await api("/api/stop",{method:"POST",body:{run_id:S.running.runId||"", conversation_id:S.conv||0}}); }catch(e){} } }

async function send(extra){
  extra = extra || {};
  if(S.gateway===WEB && !extra.expert && !extra.resume) return webSend();
  const expert = extra.expert || null, resume = !!extra.resume;
  const text = (expert||resume) ? (extra.text||"") : input.value.trim();
  if((!text && !expert && !resume) || S.running || (!resume && S.attachments.some(a=>!a.path))) return;
  banner("");
  if(S.view==="project"){ if(S.pview) startProjectChat(S.pview); else newChat(false); }
  const deep = $("#deep").checked, memory = $("#memory").checked;
  const shown = text || (expert ? t("expertBadge") : resume ? t("resume") : "");
  const atts = resume ? [] : S.attachments.map(a=>a.path);
  const userMsg = {role:"user", display:shown, sent:shown, meta:{deep, memory, expert:!!expert, resume, attachments:atts}};
  S.messages.push(userMsg);
  const el = document.createElement("div"); el.className = "msg assistant"; el.innerHTML = `<div class="body"><p class="cursor"></p></div>`;
  const run = {el, body: el.querySelector(".body"), parts: [], runId:null};
  S.running = run; if(!expert && !resume){ input.value=""; autosize(); } updateSend(); renderThread();
  const payload = {text, gateway:S.gateway, model:realModel($("#model").value.trim()), effort:$("#effort").value, permission_mode:$("#perm").value,
    deep, memory, attachments:atts, project:S.project, conversation_id:S.conv, resume,
    project_id:S.projectId, preapprove:S.preapprove, verify:$("#verify").checked, visual:$("#visual").checked, account:S.account,
    failover:$("#failover").checked, quick:$("#quick").checked, light:$("#light").checked, handoff_from:(!S.conv && S.handoffFrom) ? S.handoffFrom.id : undefined};
  if(expert) payload.expert = expert;
  if(!resume){ S.attachments = []; renderChips(); }
  let finalMeta = null;
  try{
    const res = await fetch("/api/chat",{method:"POST",headers:{"X-Allinone-Token":TOKEN,"Content-Type":"application/json"},body:JSON.stringify(payload)});
    if(!res.ok){ let m="HTTP "+res.status; try{ m=(await res.json()).error||m; }catch(e){} throw new Error(m); }
    const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = "";
    for(;;){
      const {value, done} = await reader.read(); if(done) break;
      buf += dec.decode(value, {stream:true}); let nl;
      while((nl = buf.indexOf("\n")) >= 0){ const line = buf.slice(0,nl).trim(); buf = buf.slice(nl+1); if(line){ try{ const ev = JSON.parse(line); handle(ev, run, userMsg); }catch(e){} } }
    }
  }catch(e){ run.parts.push({kind:"error", text:e.message}); drawRun(run); }
  if(run.parts.some(p=>p.kind!=="notice")){  // nothing was saved by the server (connection lost...)
    const textAll = run.parts.filter(p=>p.kind==="text").map(p=>p.text).join("\n\n");
    S.messages.push({role:"assistant", display:textAll, meta:{parts: run.parts.filter(p=>p.kind!=="wait"&&p.kind!=="visual").map(p=>p.kind==="error"?{kind:"text",text:p.text,error:true}:p)}});
  }
  S.running = null; updateSend(); renderThread(); loadConvs(); refreshState();
}
function handle(ev, run, userMsg){
  switch(ev.type){
    case "conversation": S.conv = ev.id; S.handoffFrom = null; renderHoChip(); renderProjChip(); loadConvs(); break;
    case "start": run.runId = ev.run_id; if(!userMsg._started){ userMsg.sent = ev.sent; userMsg._started = true; } refreshState(); if($("#showSent").checked) renderThread(); break;
    case "notice": run.parts.push({kind:"notice", text:ev.text}); break;
    case "segment": run.parts.push({kind:"text", text:""}); break;
    case "delta": { let p = run.parts[run.parts.length-1]; if(!p || p.kind!=="text"){ p={kind:"text",text:""}; run.parts.push(p); } p.text += ev.text; break; }
    case "text": run.parts.push({kind:"text", text:ev.text}); break;
    case "thinking": { let p = run.parts[run.parts.length-1]; if(!p || p.kind!=="thinking"){ p={kind:"thinking",text:""}; run.parts.push(p); } p.text += ev.text; break; }
    case "tool_use": run.parts.push({kind:"tool", id:ev.id, name:ev.name, input:ev.input, result:null}); break;
    case "tool_result": { const p = run.parts.find(x=>x.kind==="tool" && x.id===ev.id); if(p){ p.result = ev.content; p.is_error = ev.is_error; } break; }
    case "error": run.parts.push({kind:"error", text:ev.text}); if(ev.need_login){ banner(ev.text, true); } break;
    case "approval": run.parts.push({kind:"approval", id:ev.id, tool:ev.tool, input:ev.input, state:null}); break;
    case "saved": {
      const textAll = (ev.meta.parts||[]).filter(p=>p.kind==="text"&&!p.error).map(p=>p.text).join("\n\n");
      S.messages.push({role:"assistant", display:textAll, meta:ev.meta}); run.parts = []; renderThread(); return; }
    case "auto_resume": run.parts.push({kind:"wait", until:ev.until, title:ev.title, attempt:ev.attempt, max:ev.max}); break;
    case "resume_start": run.parts = []; S.messages.push({role:"user", display:ev.display, sent:ev.sent, meta:{resume:true, auto:true}});
      if(ev.gateway && gwInfo(ev.gateway)){ S.gateway = ev.gateway; LS.set("gateway", ev.gateway); renderPills(); loadModels(); }
      renderThread(); return;
    case "verify": {
      if(!ev.check){ run.parts.push({kind:"notice", text:t("vSelf")}); break; }
      const c = ev.check;
      run.parts.push({kind:ev.check.code===0?"notice":"error", text: fmt(t("vRound"),{n:c.round, c:c.cmd}) + " — " + (c.code===0 ? t("vPass") : fmt(t("vFail"),{code:c.code})) + (c.code===0 ? "" : "\n"+(c.output||"").slice(-600))});
      break; }
    case "visual": run.parts.push({kind:"visual", entry:ev.entry}); break;
    case "visual_review": run.parts.push({kind:"notice", text: fmt(t("visReview"),{r:ev.reviewer||"—"}) + " " + (ev.verdict==="ok"?t("visRevOk"):ev.verdict==="problems"?t("visRevBad")+"\n- "+(ev.problems||[]).join("\n- "):(ev.text||"").slice(0,200))}); break;
    case "approval_auto": run.parts.push({kind:"notice", text:fmt(t("preAuto"),{t:ev.tool + (ev.input&&ev.input.command?": "+ev.input.command:"")})}); break;
    case "approval_done": { const p = run.parts.find(x=>x.kind==="approval" && x.id===ev.id); if(p) p.state = ev.behavior; break; }
    default: return;
  }
  drawRun(run);
}
function waitHTML(p){
  const left = Math.max(0, Math.round(p.until - Date.now()/1000));
  const span = left>=3600 ? `${Math.floor(left/3600)}:${String(Math.floor(left%3600/60)).padStart(2,"0")}:${String(left%60).padStart(2,"0")}` : left>=60 ? `${Math.floor(left/60)}:${String(left%60).padStart(2,"0")}` : left+" "+t("sec");
  return `<div class="waitbox"><span class="spin"></span><span dir="auto">${esc(fmt(t("waitMsg"),{r:p.title, a:p.attempt, m:p.max, s:span}))}</span><button class="btn small" data-waitcancel>${esc(t("waitCancel"))}</button></div>`;
}
setInterval(()=>{ if(S.running && S.running.parts.some(p=>p.kind==="wait")) drawRun(S.running); }, 1000);
let drawPending = false;
function drawRun(run){
  if(drawPending) return; drawPending = true;
  requestAnimationFrame(()=>{ drawPending = false;
    const all = SHOWALL();
    const shown = all ? run.parts : run.parts.filter(p=>["text","approval","wait","error"].includes(p.kind));
    const tools = run.parts.filter(p=>p.kind==="tool");
    const lastTool = tools[tools.length-1];
    const activity = (!all && S.running===run && lastTool) ? `<div class="notice" dir="auto">${esc(t("working"))} ${esc(lastTool.name||"")} <span dir="ltr">${esc(String((lastTool.input&&(lastTool.input.command||lastTool.input.file_path||lastTool.input.url))||"").slice(0,70))}</span> · ${esc(fmt(t("workingN"),{n:tools.length}))}</div>` : "";
    run.body.innerHTML = activity + shown.map(p=> p.kind==="tool"?toolHTML(p) : p.kind==="approval"?approvalHTML(p) : p.kind==="wait"?waitHTML(p) : p.kind==="visual"?visualHTML(p.entry) : p.kind==="thinking"?`<div class="thinking">${esc(p.text)}</div>`
      : p.kind==="notice"?`<div class="notice">${esc(brandText(p.text))}</div>` : p.kind==="error"?`<div class="err">${esc(brandText(p.text))}</div>` : md(brandText(p.text||""))).join("")
      + (S.running===run?'<p class="cursor"></p>':"");
    wire(run.body);
    run.body.querySelectorAll("[data-waitcancel]").forEach(b=>b.onclick=()=>stopRun());
    run.body.querySelectorAll("[data-ap]").forEach(b=>b.onclick=async()=>{
      const act = b.dataset.act, p = run.parts.find(x=>x.kind==="approval" && x.id===b.dataset.ap); if(!p || p.state) return;
      p.state = act==="deny" ? "deny" : "allow"; drawRun(run);
      try{ await api("/api/approval",{method:"POST",body:{id:p.id, allow:act!=="deny", scope:act==="conv"?"conversation":"once"}}); }catch(e){ banner(e.message,true); }
    });
    scrollDown(run.parts.some(x=>x.kind==="approval" && !x.state)); });
}

/* ---------- boot ---------- */
async function refreshState(){ try{ S.state = await api("/api/state"); renderPills(); }catch(e){ banner(e.message,true); } }
async function boot(){
  applyTheme(LS.get("theme", matchMedia("(prefers-color-scheme: dark)").matches?"dark":"light"));
  try{ S.state = await api("/api/state"); }catch(e){ document.body.innerHTML = `<p style="padding:30px">${esc(e.message)} — open the address printed in the Allinone window.</p>`; return; }
  S.lang = LS.get("lang", S.state.lang || "ar");
  $("#ver").textContent = "v"+S.state.version;
  const saved = LS.get("gateway", null);
  S.gateway = (gwInfo(saved) || saved===WEB) ? saved : S.state.default_gateway;
  S.project = LS.get("project", S.state.project) || S.state.project; showProject();
  try{ S.projects = (await api("/api/projects")).projects; }catch(e){}
  S.account = LS.get("account", "default");
  applyLang(); loadModels(); loadConvs(); loadAccounts(); refreshAuth(); updateSend(); input.focus();
  setInterval(()=>{ if(!S.running) refreshState(); }, 15000);
}
boot();
</script>
